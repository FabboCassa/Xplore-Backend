version: '3.8'

services:
  # 🐘 PostgreSQL: Il database relazionale principale
  postgres:
    image: postgres:16-alpine
    container_name: xplore-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: xplore_db
    ports:
      - "5432:5432"
    volumes:
      - ./.docker/postgres-data:/var/lib/postgresql/data
    networks:
      - xplore-net

  # 🐇 RabbitMQ: Il Message Broker per la comunicazione asincrona
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: xplore-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # Porta per la comunicazione AMQP (.NET)
      - "15672:15672" # Porta per la Dashboard Web
    networks:
      - xplore-net

  # 🧠 Qdrant: Il Vector Database per la RAG (Embeddings)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: xplore-qdrant
    ports:
      - "6333:6333" # Porta API HTTP
    volumes:
      - ./.docker/qdrant-data:/qdrant/storage
    networks:
      - xplore-net

  # 🔍 Seq: Log centralizzati (Observability)
  seq:
    image: datalust/seq:latest
    container_name: xplore-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80" # Dashboard accessibile su localhost:5341
    networks:
      - xplore-net

networks:
  xplore-net:
    driver: bridge
version: '3.8'

services:
  # 🐘 PostgreSQL: ORA È CORRETTO SULLA 5435
  postgres:
    image: postgres:16-alpine
    container_name: xplore-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: xplore_db
    ports:
      - "5435:5432"  # <--- Esterna 5435 (Libera), Interna 5432 (Standard PG)
    volumes:
      - ./.docker/postgres-data:/var/lib/postgresql/data
    networks:
      - xplore-net

  # 🐇 RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: xplore-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - xplore-net

  # 🧠 Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: xplore-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./.docker/qdrant-data:/qdrant/storage
    networks:
      - xplore-net

  # 🔍 Seq: CORRETTO SULLA 5341 (Standard Seq)
  seq:
    image: datalust/seq:latest
    container_name: xplore-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"   # <--- Seq usa la 80 interna, la esponiamo sulla 5341
    networks:
      - xplore-net

networks:
  xplore-net:
    driver: bridge